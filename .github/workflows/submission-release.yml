name: Publish v1.0 Submission

on:
  push:
    tags:
      - v1.0-submission

permissions:
  contents: write

jobs:
  publish-fixed-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source and fixed assets
        uses: actions/checkout@v7

      - name: Verify submission asset hashes
        run: sha256sum --check output/release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            output/release/DentalViz-v1.0-submission-windows-x64.zip \
            output/pdf/DentalViz_Huvitz_Portfolio.pdf \
            docs/demo/DentalViz-v0.8-portfolio-demo.mp4 \
            output/release/SHA256SUMS.txt \
            --verify-tag \
            --latest \
            --title "DentalViz v1.0 제출 패키지" \
            --notes-file .github/release-notes-v1.0.md
